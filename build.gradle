plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Only for the settings button in Mod Menu, the mod runs without it.
	modCompileOnly "maven.modrinth:modmenu:14.0.2"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Only for testing: a client game test creates a world and lets the demo play every scene. Not part of the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fakedeath-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// ./gradlew runClientGameTest -PdemoScenes=tornado,mond plays only those scenes.
loom {
	runs {
		clientGameTest {
			vmArg "-Dfakedeath.demoScenes=" + (project.findProperty("demoScenes") ?: "demo")
		}
	}
}
