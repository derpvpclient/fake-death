plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Only for the settings button in Mod Menu, the mod runs without it.
	compileOnly files("libs/modmenu-21.0.0.jar")
	// In the game test Mod Menu is really there, to look at the update notice.
	localRuntime files("libs/modmenu-21.0.0.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Only for testing: a client game test creates a world and lets the demo play every scene. Not part of the jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fakedeath-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// ./gradlew runClientGameTest -PdemoScenes=tornado,mond plays only those scenes.
loom {
	runs {
		clientGameTest {
			vmArg "-Dfakedeath.demoScenes=" + (project.findProperty("demoScenes") ?: "demo")
			vmArg "-Dfakedeath.demoFrames=" + (project.findProperty("demoFrames") ?: "0")
			vmArg "-Dfakedeath.demoView=" + (project.findProperty("demoView") ?: "")
			vmArg "-Dfakedeath.demoUi=" + (project.findProperty("demoUi") ?: "false")
			vmArg "-Dfakedeath.demoTree=" + (project.findProperty("demoTree") ?: "false")
			vmArg "-Dfakedeath.demoRandom=" + (project.findProperty("demoRandom") ?: "false")
			vmArg "-Dfakedeath.updateTest=" + (project.findProperty("demoUpdate") ?: "")
		}
	}
}
